<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mission Sarkari Engineer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --brand-navy-950: #060B14;
      --brand-navy-900: #0B132B;
      --brand-navy-800: #1C2541;

      --primary-blue: #2563EB;
      --primary-blue-hover: #1D4ED8;
      --primary-light: #EFF6FF;
      --accent-cyan: #38BDF8;

      --bg-page: #F8FAFC;
      --surface-white: #FFFFFF;

      --border-light: #E2E8F0;
      --border-medium: #CBD5E1;
      --border-dark: #94A3B8;

      --text-main: #0F172A;
      --text-muted: #475569;
      --text-subtle: #64748B;

      --shadow-ambient: 0 4px 18px -2px rgba(15, 23, 42, 0.05);
      --shadow-card: 0 10px 30px -4px rgba(15, 23, 42, 0.06);
      --shadow-card-hover: 0 16px 36px -6px rgba(37, 99, 235, 0.16);
    }

    *, *:before, *:after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-page);
      background-image: 
        radial-gradient(at 10% 10%, rgba(37, 99, 235, 0.035) 0px, transparent 45%),
        radial-gradient(at 90% 90%, rgba(56, 189, 248, 0.035) 0px, transparent 45%);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* 1. TOP HEADER */
    .top-broad-header {
      background: linear-gradient(135deg, var(--brand-navy-950) 0%, var(--brand-navy-900) 55%, var(--brand-navy-800) 100%);
      padding: 18px 36px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 12px 28px -8px rgba(6, 11, 20, 0.45);
      position: relative;
      width: 100%;
    }

    .top-broad-header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary-blue) 25%, var(--accent-cyan) 50%, var(--primary-blue) 75%, transparent);
    }

    .header-inner {
      max-width: 1300px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .portal-logo-img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.12), 0 8px 20px rgba(0, 0, 0, 0.35);
      transition: transform 0.3s ease;
      flex-shrink: 0;
    }

    .brand-container:hover .portal-logo-img {
      transform: rotate(12deg) scale(1.05);
    }

    .top-broad-header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #FFFFFF 40%, #BAE6FD 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }

    /* WELCOME STRIP */
    .welcome-bar {
      background: var(--brand-navy-950);
      border-bottom: 1px solid rgba(37, 99, 235, 0.18);
      padding: 10px 0;
      width: 100%;
    }

    .welcome-bar-inner {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    .welcome-text {
      font-size: 0.86rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--accent-cyan);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      animation: slowBlink 4s ease-in-out infinite;
    }

    .welcome-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-cyan);
      display: inline-block;
    }

    @keyframes slowBlink {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6)); }
      50% { opacity: 0.3; filter: drop-shadow(0 0 0px transparent); }
    }

    /* 2. WORKSPACE */
    main {
      flex: 1;
      width: 100%;
      max-width: 1260px;
      margin: 0 auto;
      padding: 30px 24px 50px;
      transition: all 0.25s ease;
    }

    /* HOME SEARCH & FILTERS */
    .filter-wrapper {
      background: var(--surface-white);
      border: 1px solid var(--border-light);
      border-radius: 20px;
      padding: 26px 32px;
      box-shadow: var(--shadow-card);
      margin-bottom: 26px;
      width: 100%;
    }

    .search-box {
      position: relative;
      margin-bottom: 18px;
    }

    .search-box input {
      width: 100%;
      padding: 16px 24px 16px 56px;
      border: 1.5px solid var(--border-medium);
      border-radius: 12px;
      font-size: 0.96rem;
      font-weight: 500;
      outline: none;
      background: #FFFFFF;
      color: var(--text-main);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
      transition: all 0.2s ease;
    }

    .search-box input:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .search-icon-symbol {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.15rem;
    }

    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn-filter {
      padding: 12px 24px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 10px;
      border: 1px solid var(--border-light);
      background: #FFFFFF;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-filter:hover {
      border-color: #93C5FD;
      color: var(--primary-blue);
      background: var(--primary-light);
      transform: translateY(-1px);
    }

    .btn-filter.active {
      background: var(--brand-navy-900);
      color: #FFFFFF;
      border-color: var(--brand-navy-900);
      box-shadow: 0 4px 14px rgba(11, 19, 43, 0.25);
    }

    /* 3. SHOWCASE SLIDER */
    .train-slider-container {
      width: 100%;
      overflow: hidden;
      position: relative;
      border-radius: 18px;
      padding: 8px 0;
      margin-top: 6px;
    }

    .train-track {
      display: flex;
      gap: 22px;
      width: max-content;
      animation: trainSlide 28s linear infinite;
    }

    .train-track:hover {
      animation-play-state: paused;
    }

    @keyframes trainSlide {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .train-card-photo {
      width: 320px;
      height: 190px;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-ambient);
      border: 1px solid var(--border-light);
      flex-shrink: 0;
      cursor: default;
      background: #E2E8F0;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .train-card-photo:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-card-hover);
    }

    .train-card-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .photo-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(6, 11, 20, 0.95) 0%, rgba(6, 11, 20, 0.35) 60%, transparent 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 16px 20px;
      color: #FFFFFF;
    }

    .photo-overlay p {
      font-size: 0.92rem;
      color: #F8FAFC;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    /* 4. BALANCED FLOWCHART SYSTEM */
    .results-area {
      display: none;
      width: 100%;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .results-top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      padding: 0 4px;
      width: 100%;
    }

    .btn-nav-action {
      background: #FFFFFF;
      border: 1.5px solid var(--border-medium);
      color: var(--text-main);
      cursor: pointer;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 10px 22px;
      border-radius: 10px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow-ambient);
    }

    .btn-nav-action:hover {
      background: var(--brand-navy-900);
      color: #FFFFFF;
      border-color: var(--brand-navy-900);
      transform: translateX(-3px);
    }

    .tree-flow-canvas {
      background: #FFFFFF;
      border: 1px solid var(--border-light);
      border-radius: 24px;
      padding: 50px 32px 64px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      width: 100%;
      min-height: 72vh;
    }

    .tree-root-head {
      background: linear-gradient(135deg, var(--brand-navy-950) 0%, var(--brand-navy-900) 100%);
      color: #FFFFFF;
      padding: 14px 44px;
      border-radius: 12px;
      font-size: 1.08rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      border: 1.5px solid var(--primary-blue);
      box-shadow: 0 12px 28px -4px rgba(11, 19, 43, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 12px;
      z-index: 3;
    }

    .tree-stem-start {
      width: 2.5px;
      height: 40px;
      background: var(--border-dark);
    }

    .flow-tree-spine {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .flow-tree-spine::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 26px;
      left: 50%;
      width: 2.5px;
      background: var(--border-medium);
      transform: translateX(-50%);
      z-index: 1;
    }

    .flow-branch-row {
      display: flex;
      align-items: center;
      width: 100%;
      position: relative;
      margin-bottom: 28px;
      z-index: 2;
    }

    .flow-branch-row:last-child {
      margin-bottom: 0;
    }

    .flow-branch-side {
      width: 50%;
      display: flex;
      align-items: center;
      position: relative;
    }

    .flow-branch-side.left {
      justify-content: flex-end;
      padding-right: 48px;
    }

    .flow-branch-side.left.has-card::after {
      content: '';
      position: absolute;
      right: 0;
      top: 50%;
      width: 48px;
      height: 2px;
      background: var(--border-dark);
      transform: translateY(-50%);
    }

    .flow-branch-side.right {
      justify-content: flex-start;
      padding-left: 48px;
    }

    .flow-branch-side.right.has-card::after {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 48px;
      height: 2px;
      background: var(--border-dark);
      transform: translateY(-50%);
    }

    .flow-center-node {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 3px solid var(--primary-blue);
      transform: translate(-50%, -50%);
      z-index: 3;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }

    .flow-item-card {
      background: #FFFFFF;
      border: 1.5px solid var(--border-light);
      border-radius: 14px;
      padding: 16px 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow-ambient);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      width: 380px;
      max-width: 100%;
      box-sizing: border-box;
    }

    .flow-item-card:hover {
      transform: translateY(-3px);
      border-color: var(--primary-blue);
      box-shadow: var(--shadow-card-hover);
    }

    .flow-item-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      background: var(--primary-light);
      border: 1px solid #DBEAFE;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .flow-item-card:hover .flow-item-icon {
      transform: scale(1.08);
    }

    .flow-item-title {
      font-size: 0.96rem;
      font-weight: 700;
      color: #1E293B;
      line-height: 1.4;
      flex: 1;
      transition: color 0.2s ease;
    }

    .flow-item-card:hover .flow-item-title {
      color: var(--primary-blue);
    }

    /* 5. ZOOMABLE, PANTABLE & PAGE-AWARE VIEWER */
    .reader-stage-section {
      display: none;
      width: 100%;
      animation: fadeIn 0.25s ease;
    }

    .reader-toolbar {
      background: #FFFFFF;
      border: 1px solid var(--border-light);
      border-radius: 16px 16px 0 0;
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow-ambient);
      width: 100%;
      flex-wrap: wrap;
    }

    .reader-doc-heading {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .reader-tools-group {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    /* Page Navigation Toolbar */
    .page-pagination-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #F8FAFC;
      padding: 4px 8px;
      border-radius: 10px;
      border: 1px solid var(--border-light);
    }

    .btn-page-nav {
      background: #FFFFFF;
      border: 1px solid var(--border-medium);
      color: var(--text-main);
      width: 30px;
      height: 30px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.82rem;
      transition: all 0.2s ease;
    }

    .btn-page-nav:hover {
      background: var(--primary-blue);
      color: #FFFFFF;
      border-color: var(--primary-blue);
    }

    .page-indicator-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0 4px;
      color: var(--text-muted);
    }

    /* Zoom Toolbar */
    .zoom-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #F8FAFC;
      padding: 4px 10px;
      border-radius: 10px;
      border: 1px solid var(--border-light);
    }

    .btn-zoom {
      background: #FFFFFF;
      border: 1px solid var(--border-medium);
      color: var(--text-main);
      width: 30px;
      height: 30px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .btn-zoom:hover {
      background: var(--primary-blue);
      color: #FFFFFF;
      border-color: var(--primary-blue);
    }

    .zoom-display-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      min-width: 44px;
      text-align: center;
      color: var(--text-muted);
    }

    .btn-zoom-reset {
      background: transparent;
      border: none;
      color: var(--primary-blue);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 6px;
    }

    /* Scrollable / Draggable Viewport */
    .reader-frame-viewport {
      width: 100%;
      height: 84vh;
      background: #E2E8F0;
      border: 1px solid var(--border-light);
      border-top: none;
      border-radius: 0 0 16px 16px;
      overflow: auto;
      box-shadow: var(--shadow-card);
      position: relative;
      cursor: grab;
    }

    .reader-frame-viewport:active {
      cursor: grabbing;
    }

    .zoomable-frame-wrap {
      width: 100%;
      height: 100%;
      min-width: 1000px;
      min-height: 1000px;
      transform-origin: top left;
      transition: transform 0.1s ease-out;
      background: #FFFFFF;
    }

    .zoomable-frame-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #FFFFFF;
      display: block;
    }

    /* 6. MOTIVATIONAL QUOTE */
    .bottom-quote-section {
      margin-top: 40px;
      padding: 18px 24px;
      background: #FFFFFF;
      border: 1px solid var(--border-light);
      border-radius: 14px;
      text-align: center;
      box-shadow: var(--shadow-ambient);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }

    .bottom-quote-section p {
      font-size: 0.88rem;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    /* 7. FOOTER */
    footer {
      background: linear-gradient(135deg, var(--brand-navy-950) 0%, var(--brand-navy-900) 100%);
      color: #94A3B8;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 20px 36px;
      font-size: 0.84rem;
      width: 100%;
      margin-top: auto;
    }

    .footer-inner {
      max-width: 1260px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
    }

    .visitor-box {
      font-family: 'JetBrains Mono', monospace;
      color: #CBD5E1;
      font-size: 0.84rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .visitor-count {
      color: var(--accent-cyan);
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    /* RESPONSIVE MOBILE ADJUSTMENTS */
    @media (max-width: 820px) {
      main, .top-broad-header, .welcome-bar, footer {
        padding-left: 14px;
        padding-right: 14px;
      }

      .portal-logo-img {
        width: 38px;
        height: 38px;
      }

      .top-broad-header h1 {
        font-size: 1.25rem;
      }

      .filter-wrapper {
        padding: 16px 14px;
        border-radius: 16px;
      }

      .search-box input {
        padding: 12px 16px 12px 42px;
        font-size: 0.88rem;
      }

      .filter-buttons {
        gap: 6px;
      }

      .btn-filter {
        flex: 1 1 calc(50% - 6px);
        text-align: center;
        padding: 9px 8px;
        font-size: 0.78rem;
      }

      .train-card-photo {
        width: 240px;
        height: 150px;
      }

      .tree-flow-canvas {
        padding: 24px 14px 30px;
        border-radius: 18px;
      }

      .tree-root-head {
        font-size: 0.88rem;
        padding: 10px 20px;
      }

      .tree-stem-start {
        height: 20px;
      }

      .flow-tree-spine::before {
        left: 20px;
        bottom: 14px;
      }

      .flow-branch-row {
        flex-direction: column;
        margin-bottom: 14px;
        padding-left: 36px;
      }

      .flow-branch-side {
        width: 100%;
        padding: 0 !important;
        justify-content: flex-start !important;
      }

      .flow-branch-side.has-card::after {
        left: -16px !important;
        right: auto !important;
        width: 16px !important;
      }

      .flow-center-node {
        left: 20px;
        top: 24px;
      }

      .flow-item-card {
        width: 100%;
        max-width: 100%;
        padding: 13px 15px;
      }

      .flow-item-icon {
        width: 38px;
        height: 38px;
        font-size: 1.05rem;
      }

      .flow-item-title {
        font-size: 0.9rem;
      }

      .reader-toolbar {
        padding: 12px 14px;
        flex-direction: column;
        align-items: flex-start;
      }

      .reader-doc-heading {
        font-size: 0.92rem;
        width: 100%;
      }

      .reader-tools-group {
        width: 100%;
        justify-content: space-between;
      }

      .reader-frame-viewport {
        height: 78vh;
      }

      .footer-inner {
        flex-direction: column;
        gap: 8px;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <div class="top-broad-header">
    <div class="header-inner">
      <div class="brand-container">
        <img src="logo.png" alt="Mission Sarkari Engineer Logo" class="portal-logo-img" />
        <h1>Mission Sarkari Engineer</h1>
      </div>
    </div>
  </div>

  <div id="welcomeStrip" class="welcome-bar">
    <div class="welcome-bar-inner">
      <div class="welcome-text">
        <span class="welcome-dot"></span>
        <span>Welcome to Mission Sarkari Engineer</span>
      </div>
    </div>
  </div>

  <main id="mainWorkspace">
    
    <div id="homeFilterSection" class="filter-wrapper">
