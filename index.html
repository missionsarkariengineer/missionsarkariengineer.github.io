<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Mission Sarkari Engineer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --header-bg: radial-gradient(circle at 50% 0%, #172554 0%, #0B1120 75%, #030712 100%);
      --accent: #3B82F6;
      --accent-hover: #2563EB;
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --border: #E2E8F0;
      --border-subtle: rgba(226, 232, 240, 0.8);
      --text: #0F172A;
      --text-muted: #64748B;
      --danger: #EF4444;
      --glass-bg: rgba(255, 255, 255, 0.85);
      --card-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.05), 0 4px 10px -2px rgba(15, 23, 42, 0.02);
      --card-hover: 0 20px 40px -10px rgba(15, 23, 42, 0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.04) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.04) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* 1. TOP HEADER */
    .top-broad-header {
      background: var(--header-bg);
      padding: 24px 36px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 35px -5px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    .top-broad-header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #3B82F6 20%, #60A5FA 50%, #3B82F6 80%, transparent);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    .brand-container {
      grid-column: 2;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .portal-logo-img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.15), 0 8px 20px rgba(0, 0, 0, 0.35);
      transition: transform 0.3s ease;
      flex-shrink: 0;
    }

    .brand-container:hover .portal-logo-img {
      transform: rotate(15deg) scale(1.05);
    }

    .top-broad-header h1 {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #FFFFFF 40%, #93C5FD 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }

    .header-actions {
      grid-column: 3;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
    }

    .btn-header-admin {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 9px 18px;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      color: #E2E8F0;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
      backdrop-filter: blur(10px);
      white-space: nowrap;
    }

    .btn-header-admin:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #FFFFFF;
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    .btn-header-upload {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 9px 18px;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid rgba(96, 165, 250, 0.4);
      background: linear-gradient(135deg, #2563EB, #1D4ED8);
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
      white-space: nowrap;
    }

    .btn-header-upload:hover {
      background: linear-gradient(135deg, #3B82F6, #2563EB);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
      transform: translateY(-1px);
    }

    /* LEFT-ALIGNED WELCOME STRIP */
    .welcome-bar {
      background: #060B18;
      border-bottom: 1px solid rgba(59, 130, 246, 0.2);
      padding: 10px 0;
    }

    .welcome-bar-inner {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    .welcome-text {
      font-size: 0.86rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #38BDF8;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      animation: slowBlink 4s ease-in-out infinite;
    }

    .welcome-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #38BDF8;
      box-shadow: 0 0 10px #38BDF8;
      display: inline-block;
    }

    @keyframes slowBlink {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6)); }
      50% { opacity: 0.3; filter: drop-shadow(0 0 0px transparent); }
    }

    /* 2. MAIN WORKSPACE */
    main {
      flex: 1;
      max-width: 1000px;
      margin: 0 auto;
      padding: 36px 20px 40px;
      width: 100%;
    }

    .filter-wrapper {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 26px;
      box-shadow: var(--card-shadow);
      margin-bottom: 28px;
    }

    .search-box {
      position: relative;
      margin-bottom: 20px;
    }

    .search-box input {
      width: 100%;
      padding: 16px 22px 16px 54px;
      border: 1.5px solid #CBD5E1;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 500;
      outline: none;
      background: #FFFFFF;
      color: #0F172A;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
      transition: all 0.25s ease;
    }

    .search-box input:focus {
      border-color: #3B82F6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
    }

    .search-box i {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: #3B82F6;
      font-size: 1.15rem;
    }

    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn-filter {
      padding: 10px 18px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 10px;
      border: 1px solid #E2E8F0;
      background: #FFFFFF;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-filter:hover {
      border-color: #93C5FD;
      color: #2563EB;
      background: #F0F7FF;
      transform: translateY(-1px);
    }

    .btn-filter.active {
      background: #0F172A;
      color: #FFFFFF;
      border-color: #0F172A;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.2);
    }

    /* 3. CONTINUOUS PHOTO SLIDER */
    .train-slider-container {
      width: 100%;
      overflow: hidden;
      position: relative;
      border-radius: 18px;
      padding: 10px 0;
      margin-top: 8px;
    }

    .train-track {
      display: flex;
      gap: 20px;
      width: max-content;
      animation: trainSlide 28s linear infinite;
    }

    .train-track:hover {
      animation-play-state: paused;
    }

    @keyframes trainSlide {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .train-card-photo {
      width: 290px;
      height: 175px;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(255, 255, 255, 0.8);
      flex-shrink: 0;
      cursor: default;
      background: #E2E8F0;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .train-card-photo:hover {
      transform: translateY(-4px);
      box-shadow: var(--card-hover);
    }

    .train-card-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .photo-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(3, 7, 18, 0.92) 0%, rgba(3, 7, 18, 0.3) 60%, transparent 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 16px 18px;
      color: #FFFFFF;
    }

    .photo-overlay p {
      font-size: 0.88rem;
      color: #F8FAFC;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    /* 4. PROFESSIONAL EXECUTIVE FLOWCHART ARCHITECTURE */
    .results-area {
      display: none;
      animation: fadeIn 0.35s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .btn-clear {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-weight: 700;
      font-size: 0.86rem;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-clear:hover {
      color: var(--accent-hover);
      transform: translateX(-2px);
    }

    /* Professional Flowchart Blueprint */
    .mindmap-board {
      background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%);
      border: 1px solid var(--border-subtle);
      border-radius: 28px;
      padding: 44px 28px 48px;
      box-shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.06);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    .mindmap-board::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(148, 163, 184, 0.22) 1.2px, transparent 1.2px);
      background-size: 24px 24px;
      pointer-events: none;
    }

    /* Central Root Node (Hub) */
    .mindmap-root-node {
      background: linear-gradient(135deg, #091224 0%, #1E293B 100%);
      color: #FFFFFF;
      padding: 14px 34px;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      box-shadow: 0 12px 28px -4px rgba(15, 23, 42, 0.35);
      display: inline-flex;
      align-items: center;
      gap: 12px;
      z-index: 3;
      border: 2px solid #3B82F6;
      position: relative;
    }

    .mindmap-root-node::after {
      content: 'CORE STREAM';
      position: absolute;
      top: -10px;
      right: 18px;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      background: #3B82F6;
      color: #FFFFFF;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .mindmap-root-node i {
      color: #38BDF8;
      font-size: 1.15rem;
    }

    /* Modern Flow Connector Wire */
    .flow-wire-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 860px;
      margin: 0 0 28px;
      z-index: 1;
    }

    .flow-wire-vertical {
      width: 2.5px;
      height: 28px;
      background: linear-gradient(to bottom, #3B82F6, #93C5FD);
    }

    .flow-wire-junction {
      width: 82%;
      height: 2.5px;
      background: #93C5FD;
      position: relative;
      display: flex;
      justify-content: space-between;
    }

    .flow-wire-junction::before,
    .flow-wire-junction::after {
      content: '';
      position: absolute;
      width: 8px;
      height: 8px;
      background: #3B82F6;
      border-radius: 50%;
      top: -2.75px;
      box-shadow: 0 0 8px #3B82F6;
    }

    .flow-wire-junction::before { left: 0; }
    .flow-wire-junction::after { right: 0; }

    .flow-wire-sub-drop {
      width: 2.5px;
      height: 22px;
      background: #93C5FD;
    }

    /* Mind Map Nodes Grid */
    .mindmap-nodes-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 940px;
      z-index: 2;
      position: relative;
    }

    /* Individual Flow Node Cards (Arrow Removed, Clean Aesthetic) */
    .mindmap-node-card {
      background: #FFFFFF;
      border: 1.5px solid #E2E8F0;
      border-radius: 18px;
      padding: 18px 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
