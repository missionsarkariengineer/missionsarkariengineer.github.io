<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mechanical Engineering Study Hub</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: #0f172a;
      line-height: 1.6;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: white;
      padding: 45px 0;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    header h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    header p {
      opacity: 0.85;
      font-size: 1rem;
    }

    /* Controls */
    .controls-section {
      margin: 30px auto 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #searchInput {
      width: 100%;
      padding: 14px 18px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 1rem;
      outline: none;
      background-color: #ffffff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #searchInput:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .filter-group {
      display: flex;
      gap: 12px;
    }

    select {
      flex: 1;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background-color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
    }

    /* Grid & Cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 60px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 2px 5px rgba(0,0,0,0.04);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.08);
    }

    .badge-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .badge-cat {
      background-color: #dbeafe;
      color: #1e40af;
    }

    .badge-sub {
      background-color: #fef3c7;
      color: #92400e;
    }

    .card h3 {
      font-size: 1.25rem;
      margin-bottom: 8px;
      color: #1e293b;
    }

    .card p {
      font-size: 0.92rem;
      color: #64748b;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .btn-download {
      display: block;
      text-align: center;
      background-color: #1e40af;
      color: white;
      padding: 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background-color 0.2s;
    }

    .btn-download:hover {
      background-color: #1d4ed8;
    }

    .no-results {
      text-align: center;
      color: #64748b;
      font-size: 1.1rem;
      margin: 50px 0;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="container">
      <h1>⚙️ Mechanical Engineering Study Hub</h1>
      <p>Free Subject Notes, Quick Revision Capsules & PYQs</p>
    </div>
  </header>

  <!-- Search & Filter Controls -->
  <section class="controls-section container">
    <input 
      type="text" 
      id="searchInput" 
      placeholder="Search topic, subject name (e.g. SOM, Thermodynamics, IC Engine)..." 
    />
    
    <div class="filter-group">
      <select id="categoryFilter">
        <option value="All">All Types</option>
        <option value="Notes">Subject Notes</option>
        <option value="Capsule">Revision Capsule</option>
        <option value="PYQ">PYQs</option>
      </select>

      <select id="subjectFilter">
        <option value="All">All Streams</option>
        <option value="Thermal">Thermal & Fluid</option>
        <option value="Design">Applied Mechanics & Design</option>
        <option value="Manufacturing">Production & Materials</option>
      </select>
    </div>
  </section>

  <!-- Material Cards Grid -->
  <main class="container">
    <div id="materialGrid" class="grid"></div>
    <p id="noResults" class="no-results" style="display: none;">Koi material nahi mila!</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
