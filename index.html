<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mission Sarkari Engineer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --header-bg: #0B132B;
      --subbar-bg: #1C2541;
      --accent: #2563EB;
      --accent-hover: #1D4ED8;
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --border: #E2E8F0;
      --text: #0F172A;
      --text-muted: #64748B;
      --tag-bg: #F1F5F9;
      --danger: #EF4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* 1. TOP HEADER WITH SHARP VECTOR EMBLEM */
    .top-broad-header {
      background: var(--header-bg);
      padding: 16px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .portal-logo {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
    }

    .top-broad-header h1 {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #FFFFFF;
    }

    /* 2. SUB-BAR */
    .sub-bar {
      background: var(--subbar-bg);
      border-bottom: 2px solid var(--accent);
      padding: 8px 24px;
    }

    .sub-bar-inner {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
    }

    .btn-sub {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-sub:hover {
      background: #FFFFFF;
      color: var(--header-bg);
    }

    .btn-upload {
      background: var(--accent);
      border-color: var(--accent);
    }

    .btn-upload:hover {
      background: var(--accent-hover);
      color: #FFFFFF;
    }

    /* 3. MAIN WORKSPACE */
    main {
      flex: 1;
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px 60px;
      width: 100%;
    }

    .filter-wrapper {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.03);
      margin-bottom: 24px;
    }

    .search-box {
      position: relative;
      margin-bottom: 18px;
    }

    .search-box input {
      width: 100%;
      padding: 13px 18px 13px 44px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.92rem;
      outline: none;
      background: #FAFBFC;
      transition: all 0.2s ease;
    }

    .search-box input:focus {
      border-color: var(--accent);
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .search-box i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn-filter {
      padding: 8px 16px;
      font-size: 0.84rem;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-filter:hover {
      border-color: #94A3B8;
      background: #F8FAFC;
    }

    .btn-filter.active {
      background: var(--header-bg);
      color: #FFFFFF;
      border-color: var(--header-bg);
    }

    /* DATA TABLE */
    .results-area {
      display: none;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .btn-clear {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.82rem;
    }

    .btn-clear:hover {
      text-decoration: underline;
    }

    .table-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow-x: auto;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.02);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    thead {
      background: #F8FAFC;
      border-bottom: 1px solid var(--border);
    }

    th {
      padding: 12px 18px;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s ease;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background: #F8FAFC;
    }

    td {
      padding: 14px 18px;
      vertical-align: middle;
    }

    .subject-cell {
      font-weight: 600;
      color: var(--text);
    }

    .stream-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--tag-bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
      text-transform: uppercase;
    }

    .action-group {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
    }

    .btn-action {
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .btn-action:hover {
      background: var(--header-bg);
      color: #FFFFFF;
      border-color: var(--header-bg);
    }

    .btn-del {
      color: var(--danger);
      border-color: #FECACA;
      background: #FEF2F2;
      display: none;
    }

    .btn-del:hover {
      background: var(--danger);
      color: #FFFFFF;
    }

    /* 4. FOOTER */
    footer {
      background: var(--header-bg);
      color: #94A3B8;
      border-top: 1px solid #1E293B;
      padding: 16px 24px;
      font-size: 0.8rem;
    }

    .footer-inner {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .visitor-box {
      font-family: 'JetBrains Mono', monospace;
      color: #CBD5E1;
      font-size: 0.78rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .visitor-count {
      color: #38BDF8;
      font-weight: 700;
    }

    /* 5. SMOOTH ANIMATED MODALS */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 19, 43, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      place-items: center;
      z-index: 1000;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
    }

    .modal-overlay.active {
      display: grid;
      opacity: 1;
    }

    .modal-card {
      background: #FFFFFF;
      border-radius: 10px;
      width: 100%;
      max-width: 440px;
      padding: 28px;
      box-shadow: 0 25px 50px -12px rgba(11, 19, 43, 0.25);
      transform: scale(0.95);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid var(--border);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-card.viewer {
      max-width: 1050px;
      height: 90vh;
      display: flex;
      flex-direction: column;
      padding: 0;
      overflow: hidden;
    }

    .modal-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      font-weight: 700;
      background: #F8FAFC;
    }

    .modal-icon-badge {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #EFF6FF;
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      margin-bottom: 14px;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--header-bg);
      margin-bottom: 4px;
    }

    .modal-subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s ease;
      background: #FAFBFC;
    }

    .form-control:focus {
      border-color: var(--accent);
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
  </style>
</head>
<body>

  <!-- 1. TOP BROAD HEADER -->
  <div class="top-broad-header">
    <div class="brand-container">
      <svg class="portal-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="48" fill="#FFFFFF" stroke="#EA580C" stroke-width="2.5" />
        <circle cx="50" cy="50" r="42" fill="none" stroke="#0B132B" stroke-width="1.5" stroke-dasharray="4,2" />
        <g fill="#0B132B" transform="translate(50,50)">
          <circle r="22" />
          <rect x="-4" y="-28" width="8" height="6" rx="1.5" />
          <rect x="-4" y="22" width="8" height="6" rx="1.5" />
          <rect x="-28" y="-4" width="6" height="8" rx="1.5" />
          <rect x="22" y="-4" width="6" height="8" rx="1.5" />
          <rect x="-21" y="-21" width="7" height="7" rx="1.5" transform="rotate(45)" />
          <rect x="14" y="14" width="7" height="7" rx="1.5" transform="rotate(45)" />
          <rect x="-21" y="14" width="7" height="7" rx="1.5" transform="rotate(-45)" />
          <rect x="14" y="-21" width="7" height="7" rx="1.5" transform="rotate(-45)" />
        </g>
        <g fill="#EA580C" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round" transform="translate(50,50)">
          <path d="M -13 4 A 13 13 0 0 1 13 4 Z" />
          <path d="M -2.5 -9 h 5 v 13 h -5 z" />
          <path d="M -16 4 Q 0 9 16 4 Q 0 6 -16 4 Z" />
        </g>
      </svg>
      <h1>Mission Sarkari Engineer</h1>
    </div>
  </div>

  <!-- 2. SUB-BAR -->
  <div class="sub-bar">
    <div class="sub-bar-inner">
      <button id="addBtn" class="btn-sub btn-upload" style="display: none;">
        <i class="fa-solid fa-plus"></i> Upload Document
      </button>
      <button id="authBtn" class="btn-sub">
        <i class="fa-solid fa-lock"></i> Admin Login
      </button>
    </div>
  </div>

  <!-- 3. CENTER WORKSPACE -->
  <main>
    <div class="filter-wrapper">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search subject (e.g. SOM, Thermodynamics, Production, Fluid Mechanics)..." />
      </div>

      <div class="filter-buttons">
        <button class="btn-filter" data-stream="Thermal & Fluids">Thermal & Fluids</button>
        <button class="btn-filter" data-stream="Design & Mechanics">Design & Mechanics</button>
        <button class="btn-filter" data-stream="Production & Materials">Production & Materials</button>
        <button class="btn-filter" data-stream="Revision & PYQs">Revision & PYQs</button>
      </div>
    </div>

    <!-- On-Demand Table -->
    <div id="resultsArea" class="results-area">
      <div class="results-header">
        <span id="resultsTitle">Filtered Documents</span>
        <button id="clearFilterBtn" class="btn-clear">Close Table &times;</button>
      </div>

      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>Subject / Document</th>
              <th style="width: 220px;">Stream</th>
              <th style="width: 180px; text-align: right;">Action</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- 4. FOOTER -->
  <footer>
    <div class="footer-inner">
      <div class="visitor-box">
        <i class="fa-solid fa-users"></i>
        <span>PORTAL VISITS:</span>
        <span id="visitorCountDisplay" class="visitor-count">000000</span>
      </div>
      <div>&copy; Mission Sarkari Engineer</div>
    </div>
  </footer>

  <!-- Reader Modal -->
  <div id="viewerModal" class="modal-overlay">
    <div class="modal-card viewer">
      <div class="modal-header">
        <span id="viewerTitle">Document</span>
        <button id="closeViewer" style="background:none; border:none; font-size:1.2rem; cursor:pointer;">&times;</button>
      </div>
      <iframe id="viewerFrame" style="flex:1; width:100%; border:none; background:#F8FAFC;" src="" allow="autoplay"></iframe>
    </div>
  </div>

  <!-- Admin Login Modal -->
  <div id="loginModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-icon-badge">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h3 class="modal-title">Admin Access</h3>
      <p class="modal-subtitle">Enter security passkey to unlock document management controls.</p>

      <div class="form-group">
        <label>Passkey</label>
        <input type="password" id="authPass" class="form-control" placeholder="Enter administrative passkey..." />
      </div>

      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 22px;">
        <button id="cancelLogin" class="btn-action">Cancel</button>
        <button id="submitLogin" class="btn-action" style="background:var(--header-bg); color:#FFFFFF;">Unlock Portal</button>
      </div>
    </div>
  </div>

  <!-- Upload Modal -->
  <div id="addModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-icon-badge">
        <i class="fa-solid fa-file-circle-plus"></i>
      </div>
      <h3 class="modal-title">Upload Document</h3>
      <p class="modal-subtitle">Save a new direct Google Drive reference link to the registry.</p>

      <div class="form-group">
        <label>Stream</label>
        <select id="docFolder" class="form-control">
          <option value="Thermal & Fluids">Thermal & Fluids</option>
          <option value="Design & Mechanics">Design & Mechanics</option>
          <option value="Production & Materials">Production & Materials</option>
          <option value="Revision & PYQs">Revision & PYQs</option>
        </select>
      </div>

      <div class="form-group">
        <label>Subject Title</label>
        <input type="text" id="docTitle" class="form-control" placeholder="e.g. Strength of Materials (SOM)" required />
      </div>

      <div class="form-group">
        <label>Google Drive Share Link</label>
        <input type="url" id="docLink" class="form-control" placeholder="https://drive.google.com/file/d/..." required />
      </div>

      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 22px;">
        <button id="cancelUpload" class="btn-action">Cancel</button>
        <button id="saveDoc" class="btn-action" style="background:var(--header-bg); color:#FFFFFF;">Save Entry</button>
      </div>
    </div>
  </div>

  <script>
    const INITIAL_DOCS = [
      { id: "1", stream: "Revision & PYQs", title: "Mechanical Theory Revision Capsule", link: "https://drive.google.com/open?id=1nyXHDl0-xdNMWxLeAzCayeLnB-nwTDH-" },
      { id: "2", stream: "Revision & PYQs", title: "Mechanical AE/JE & SSC JE Solved Question Bank", link: "https://drive.google.com/open?id=1xPqE7Dsv1FeGlr8Sf0BU7jbisB74YrGQ" },
      { id: "3", stream: "Thermal & Fluids", title: "Thermodynamics & Heat Engines", link: "https://drive.google.com/open?id=18czooBJGIBgsI6T4iLX98hFbL2cdF6nc" },
      { id: "4", stream: "Thermal & Fluids", title: "Fluid Mechanics & Hydraulic Machinery", link: "https://drive.google.com/open?id=1B4X4SMLfN_4f0gOZDxYs-RNxypPdOMYI" },
      { id: "5", stream: "Thermal & Fluids", title: "Power Plant Engineering", link: "https://drive.google.com/open?id=19SZ8Te_AdD9nrIaapl0w_1MIuCWyzaEK" },
      { id: "6", stream: "Thermal & Fluids", title: "Internal Combustion (IC) Engines", link: "https://drive.google.com/open?id=1nfurPBOP3PP9jv9APPZEXxIziAqhj_Ec" },
      { id: "7", stream: "Thermal & Fluids", title: "Refrigeration & Air Conditioning (RAC)", link: "https://drive.google.com/open?id=1JN7Z-jmVaxIqX7mrH_jsFbTOE0NYoTVr" },
      { id: "8", stream: "Design & Mechanics", title: "Strength of Materials (SOM)", link: "https://drive.google.com/open?id=189Jk_yEKq4bD_LXdCxT-mTFrntrQ0IbN" },
      { id: "9", stream: "Design & Mechanics", title: "Theory of Machines (TOM)", link: "https://drive.google.com/open?id=1BDCRGBZZ615tPYn14sJ5CqKeNKOsEQqf" },
      { id: "10", stream: "Design & Mechanics", title: "Engineering Mechanics", link: "https://drive.google.com/open?id=1chpgFcqsbCCdgIxXAQrtnaIXb-V9K1y9" },
      { id: "11", stream: "Design & Mechanics", title: "Machine Design", link: "https://drive.google.com/open?id=1KKV8iSFvNp0pO-KneMsLpW0YUGQEtQxw" },
      { id: "12", stream: "Production & Materials", title: "Production Engineering & Machining", link: "https://drive.google.com/open?id=1bvMWaqplzVdYoL3XgktcqMlHhXDbMSxz" },
      { id: "13", stream: "Production & Materials", title: "Materials Science & Metallurgy", link: "https://drive.google.com/open?id=1pjQraeK_c5-vkddSHdMvh_rO2VKIJugH" }
    ];

    let docs = JSON.parse(localStorage.getItem('mse_pro_docs')) || INITIAL_DOCS;
    let isAdmin = sessionStorage.getItem('mse_pro_auth') === 'true';
    let activeStream = null;

    function saveState() {
      localStorage.setItem('mse_pro_docs', JSON.stringify(docs));
    }

    function formatDrivePreview(url) {
      const match = url.match(/id=([a-zA-Z0-9_-]+)/) || url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      return match && match[1] ? `https://drive.google.com/file/d/${match[1]}/preview` : url;
    }

    async function initVisitorCounter() {
      const display = document.getElementById('visitorCountDisplay');
      try {
        const response = await fetch('https://api.counterapi.dev/v1/missionsarkariengineer/portal/up');
        if (response.ok) {
          const data = await response.json();
          display.textContent = data.count.toString().padStart(6, '0');
          localStorage.setItem('mse_pro_count', data.count.toString());
          return;
        }
      } catch (e) {}
      let current = parseInt(localStorage.getItem('mse_pro_count') || '1240', 10) + 1;
      localStorage.setItem('mse_pro_count', current.toString());
      display.textContent = current.toString().padStart(6, '0');
    }

    const tableBody = document.getElementById('tableBody');
    const searchInput = document.getElementById('searchInput');
    const resultsArea = document.getElementById('resultsArea');
    const resultsTitle = document.getElementById('resultsTitle');
    const clearFilterBtn = document.getElementById('clearFilterBtn');
    const filterButtons = document.querySelectorAll('.btn-filter');

    const authBtn = document.getElementById('authBtn');
    const addBtn = document.getElementById('addBtn');

    const viewerModal = document.getElementById('viewerModal');
    const viewerFrame = document.getElementById('viewerFrame');
    const viewerTitle = document.getElementById('viewerTitle');
    const closeViewer = document.getElementById('closeViewer');

    const loginModal = document.getElementById('loginModal');
    const addModal = document.getElementById('addModal');

    function renderView() {
      authBtn.innerHTML = isAdmin ? '<i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out' : '<i class="fa-solid fa-lock"></i> Admin Login';
      addBtn.style.display = isAdmin ? 'inline-flex' : 'none';

      const query = searchInput.value.toLowerCase().trim();

      if (query !== '' || activeStream !== null) {
        resultsArea.style.display = 'block';

        let filtered = docs;
        if (activeStream) {
          filtered = filtered.filter(d => d.stream === activeStream);
          resultsTitle.textContent = `${activeStream} (${filtered.length} Items)`;
        } else if (query) {
          filtered = filtered.filter(d => d.title.toLowerCase().includes(query) || d.stream.toLowerCase().includes(query));
          resultsTitle.textContent = `Search Results for "${query}" (${filtered.length} Items)`;
        }

        if (filtered.length === 0) {
          tableBody.innerHTML = `
            <tr>
              <td colspan="3" style="text-align: center; padding: 28px; color: var(--text-muted);">
                No matching subjects found.
              </td>
            </tr>
          `;
          return;
        }

        let html = '';
        filtered.forEach(doc => {
          html += `
            <tr>
              <td class="subject-cell">${doc.title}</td>
              <td><span class="stream-tag">${doc.stream}</span></td>
              <td>
                <div class="action-group">
                  <button class="btn-action" onclick="openDoc('${doc.title}', '${doc.link}')">
                    <i class="fa-solid fa-eye"></i> Read
                  </button>
                  <a href="${doc.link}" target="_blank" rel="noopener noreferrer" class="btn-action" title="Open Drive">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                  </a>
                  ${isAdmin ? `<button class="btn-action btn-del" style="display:inline-flex;" onclick="deleteDoc('${doc.id}')"><i class="fa-solid fa-trash"></i></button>` : ''}
                </div>
              </td>
            </tr>
          `;
        });
        tableBody.innerHTML = html;
      } else {
        resultsArea.style.display = 'none';
      }
    }

    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const stream = btn.getAttribute('data-stream');
        if (activeStream === stream) {
          activeStream = null;
          btn.classList.remove('active');
        } else {
          activeStream = stream;
          filterButtons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        }
        searchInput.value = '';
        renderView();
      });
    });

    searchInput.addEventListener('input', () => {
      if (searchInput.value.trim() !== '') {
        activeStream = null;
        filterButtons.forEach(b => b.classList.remove('active'));
      }
      renderView();
    });

    clearFilterBtn.addEventListener('click', () => {
      activeStream = null;
      searchInput.value = '';
      filterButtons.forEach(b => b.classList.remove('active'));
      renderView();
    });

    window.openDoc = function(title, link) {
      viewerTitle.textContent = title;
      viewerFrame.src = formatDrivePreview(link);
      viewerModal.classList.add('active');
    };

    closeViewer.addEventListener('click', () => {
      viewerModal.classList.remove('active');
      viewerFrame.src = "";
    });

    // Passkey Login: Shiv@1212
    authBtn.addEventListener('click', () => {
      if (isAdmin) {
        isAdmin = false;
        sessionStorage.removeItem('mse_pro_auth');
        renderView();
      } else {
        loginModal.classList.add('active');
      }
    });

    document.getElementById('cancelLogin').addEventListener('click', () => loginModal.classList.remove('active'));

    document.getElementById('submitLogin').addEventListener('click', () => {
      if (document.getElementById('authPass').value === "Shiv@1212") {
        isAdmin = true;
        sessionStorage.setItem('mse_pro_auth', 'true');
        loginModal.classList.remove('active');
        document.getElementById('authPass').value = "";
        renderView();
      } else {
        alert("Incorrect passkey.");
      }
    });

    addBtn.addEventListener('click', () => {
      if (activeStream) {
        document.getElementById('docFolder').value = activeStream;
      }
      addModal.classList.add('active');
    });

    document.getElementById('cancelUpload').addEventListener('click', () => addModal.classList.remove('active'));

    document.getElementById('saveDoc').addEventListener('click', () => {
      const stream = document.getElementById('docFolder').value;
      const title = document.getElementById('docTitle').value.trim();
      const link = document.getElementById('docLink').value.trim();

      if (!title || !link) {
        alert("Please fill all fields.");
        return;
      }

      docs.unshift({ id: Date.now().toString(), stream, title, link });
      saveState();
      addModal.classList.remove('active');
      document.getElementById('docTitle').value = "";
      document.getElementById('docLink').value = "";
      renderView();
    });

    window.deleteDoc = function(id) {
      if (confirm("Delete this document?")) {
        docs = docs.filter(d => d.id !== id);
        saveState();
        renderView();
      }
    };

    [viewerModal, loginModal, addModal].forEach(m => {
      m.addEventListener('click', e => {
        if (e.target === m) {
          m.classList.remove('active');
          if (m === viewerModal) viewerFrame.src = "";
        }
      });
    });

    initVisitorCounter();
    renderView();
  </script>
</body>
</html>
