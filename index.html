<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DriveHub — Mechanical Engineering Vault</title>

  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-surface: #ffffff;
      --border-subtle: #e2e8f0;
      --border-focus: #0f172a;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --accent-blue: #2563eb;
      --accent-blue-soft: #eff6ff;
      --accent-red: #ef4444;
      --accent-red-soft: #fef2f2;
      --sidebar-width: 250px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Cloud Bar */
    .top-bar {
      height: 64px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-dark);
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      background: var(--text-dark);
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 1.1rem;
    }

    .brand-name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }

    .brand-tag {
      font-size: 0.72rem;
      background: var(--accent-blue-soft);
      color: var(--accent-blue);
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
    }

    /* Search Bar */
    .search-wrapper {
      flex: 1;
      max-width: 580px;
      margin: 0 30px;
      position: relative;
    }

    .search-input {
      width: 100%;
      height: 42px;
      padding: 0 16px 0 42px;
      background: #f1f5f9;
      border: 1px solid transparent;
      border-radius: 10px;
      font-size: 0.9rem;
      color: var(--text-dark);
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      background: #fff;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.06);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      height: 38px;
      padding: 0 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
      text-decoration: none;
      border: 1px solid transparent;
    }

    .btn-dark {
      background: var(--text-dark);
      color: #fff;
    }

    .btn-dark:hover {
      background: #1e293b;
    }

    .btn-outline {
      background: transparent;
      border-color: var(--border-subtle);
      color: var(--text-dark);
    }

    .btn-outline:hover {
      background: #f1f5f9;
    }

    /* Layout Workspace */
    .app-workspace {
      display: flex;
      flex: 1;
    }

    /* Left Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    @media (max-width: 768px) {
      .sidebar { display: none; }
    }

    .sidebar-section-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      padding: 8px 12px 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      transition: all 0.15s;
    }

    .nav-item:hover {
      background: #f1f5f9;
      color: var(--text-dark);
    }

    .nav-item.active {
      background: var(--accent-blue-soft);
      color: var(--accent-blue);
    }

    /* Main File Explorer View */
    .file-manager {
      flex: 1;
      padding: 24px 32px;
      overflow-y: auto;
    }

    .header-stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .stats-pill {
      font-size: 0.78rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      background: #e2e8f0;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    /* File Cards Grid */
    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }

    .file-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      position: relative;
    }

    .file-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
      border-color: #cbd5e1;
    }

    .file-preview-block {
      height: 120px;
      background: #f8fafc;
      border: 1px dashed var(--border-subtle);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
      color: var(--accent-red);
    }

    .file-preview-block i {
      font-size: 2.2rem;
    }

    .file-code-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      background: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
    }

    .file-info h4 {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 4px;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-info p {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.4;
      height: 32px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      margin-bottom: 14px;
    }

    .file-actions-strip {
      display: flex;
      gap: 6px;
      border-top: 1px solid var(--border-subtle);
      padding-top: 12px;
    }

    .btn-file-open {
      flex: 1;
      height: 32px;
      background: var(--accent-blue-soft);
      color: var(--accent-blue);
      border: none;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-file-open:hover {
      background: var(--accent-blue);
      color: #fff;
    }

    .btn-file-ext {
      width: 32px;
      height: 32px;
      background: transparent;
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      color: var(--text-muted);
      display: grid;
      place-items: center;
      text-decoration: none;
      font-size: 0.8rem;
    }

    .btn-file-ext:hover {
      background: #f1f5f9;
      color: var(--text-dark);
    }

    .btn-file-del {
      width: 32px;
      height: 32px;
      background: var(--accent-red-soft);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 6px;
      color: var(--accent-red);
      cursor: pointer;
      display: none;
      place-items: center;
      font-size: 0.8rem;
    }

    .btn-file-del:hover {
      background: var(--accent-red);
      color: #fff;
    }

    /* Modal System */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      place-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.active {
      display: grid;
    }

    .modal-card {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 460px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }

    .modal-card.viewer {
      max-width: 1050px;
      height: 90vh;
      display: flex;
      flex-direction: column;
      padding: 0;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      font-size: 0.88rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--border-focus);
    }
  </style>
</head>
<body>

  <!-- Top Cloud Navigation -->
  <nav class="top-bar">
    <a href="#" class="brand-group">
      <div class="brand-icon">
        <i class="fa-solid fa-hard-drive"></i>
      </div>
      <span class="brand-name">DriveHub</span>
      <span class="brand-tag">ME Cloud</span>
    </a>

    <!-- Universal Search -->
    <div class="search-wrapper">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="searchInput" class="search-input" placeholder="Search files, subjects, notes..." />
    </div>

    <!-- Actions -->
    <div class="top-actions">
      <button id="addBtn" class="btn btn-dark" style="display: none;">
        <i class="fa-solid fa-cloud-arrow-up"></i> Upload File
      </button>
      <button id="authBtn" class="btn btn-outline">
        <i class="fa-solid fa-key"></i> Passkey Login
      </button>
    </div>
  </nav>

  <!-- Workspace Shell -->
  <div class="app-workspace">
    
    <!-- Sidebar Filters -->
    <aside class="sidebar">
      <span class="sidebar-section-title">Files & Categories</span>
      <button class="nav-item active" data-stream="all">
        <i class="fa-regular fa-folder-open"></i> All Files
      </button>
      <button class="nav-item" data-stream="Thermal">
        <i class="fa-solid fa-fire"></i> Thermal & Fluids
      </button>
      <button class="nav-item" data-stream="Design">
        <i class="fa-solid fa-compass-drafting"></i> Design & Mechanics
      </button>
      <button class="nav-item" data-stream="Manufacturing">
        <i class="fa-solid fa-gears"></i> Production & Materials
      </button>
      <button class="nav-item" data-stream="Capsule">
        <i class="fa-solid fa-box-archive"></i> Handbooks & PYQs
      </button>
    </aside>

    <!-- File Explorer Grid View -->
    <main class="file-manager">
      <div class="header-stat-row">
        <h2 id="viewCategoryTitle" class="section-title">All Files</h2>
        <span id="fileCountBadge" class="stats-pill">13 Items</span>
      </div>

      <div id="fileGrid" class="file-grid"></div>
    </main>
  </div>

  <!-- Document Viewer Modal -->
  <div id="viewerModal" class="modal-overlay">
    <div class="modal-card viewer">
      <div class="modal-header">
        <h4 id="viewerTitle" style="font-weight: 700; font-size: 0.95rem;">Document Viewer</h4>
        <button id="closeViewer" style="background:transparent; border:none; font-size:1.2rem; cursor:pointer; color:var(--text-muted);">&times;</button>
      </div>
      <iframe id="viewerFrame" style="flex:1; width:100%; border:none; background:#f8fafc;" src="" allow="autoplay"></iframe>
    </div>
  </div>

  <!-- Passkey Auth Modal -->
  <div id="loginModal" class="modal-overlay">
    <div class="modal-card">
      <h3 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 4px;">Security Authentication</h3>
      <p style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 18px;">Enter secret passkey for file upload and delete permissions.</p>

      <div class="form-group">
        <label>Secret Passkey</label>
        <input type="password" id="adminPass" class="form-control" placeholder="Default passkey: admin123" />
      </div>

      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px;">
        <button id="cancelLogin" class="btn btn-outline">Cancel</button>
        <button id="submitLogin" class="btn btn-dark">Unlock</button>
      </div>
    </div>
  </div>

  <!-- Upload File Modal -->
  <div id="uploadModal" class="modal-overlay">
    <div class="modal-card">
      <h3 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 4px;">Upload File to Vault</h3>
      <p style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 16px;">Add a new PDF file or study material.</p>

      <div class="form-group">
        <label>File Code / Tag</label>
        <input type="text" id="matCode" class="form-control" placeholder="e.g. ME-101" required />
      </div>
      <div class="form-group">
        <label>File Title</label>
        <input type="text" id="matTitle" class="form-control" placeholder="e.g. Thermodynamics Handout" required />
      </div>
      <div class="form-group">
        <label>Folder / Category</label>
        <select id="matStream" class="form-control">
          <option value="Thermal">Thermal & Fluids</option>
          <option value="Design">Design & Mechanics</option>
          <option value="Manufacturing">Production & Materials</option>
          <option value="Capsule">Handbooks & PYQs</option>
        </select>
      </div>
      <div class="form-group">
        <label>Short Description</label>
        <input type="text" id="matDesc" class="form-control" placeholder="Topics covered..." required />
      </div>
      <div class="form-group">
        <label>Google Drive Shareable Link</label>
        <input type="url" id="matLink" class="form-control" placeholder="https://drive.google.com/file/d/..." required />
      </div>

      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px;">
        <button id="cancelUpload" class="btn btn-outline">Cancel</button>
        <button id="saveMaterial" class="btn btn-dark">Save to Drive</button>
      </div>
    </div>
  </div>

  <script>
    const INITIAL_FILES = [
      {
        id: "1",
        code: "CAPSULE-01",
        title: "Mechanical Theory Revision Capsule",
        stream: "Capsule",
        description: "Official comprehensive quick revision handbook containing condensed theory, state diagrams, and formula derivation tables.",
        link: "https://drive.google.com/open?id=1nyXHDl0-xdNMWxLeAzCayeLnB-nwTDH-"
      },
      {
        id: "2",
        code: "PYQ-02",
        title: "Competitive Exam Solved PYQs",
        stream: "Capsule",
        description: "Exhaustive previous year solved question repository categorized chapter-wise with detailed analytical solutions.",
        link: "https://drive.google.com/open?id=1xPqE7Dsv1FeGlr8Sf0BU7jbisB74YrGQ"
      },
      {
        id: "3",
        code: "ME-TH-140",
        title: "Thermodynamics & Heat Engines",
        stream: "Thermal",
        description: "Macroscopic vs microscopic continuum analysis, Zeroth, First and Second laws of thermodynamics, ideal gas equations, and pure substance phase diagrams.",
        link: "https://drive.google.com/open?id=18czooBJGIBgsI6T4iLX98hFbL2cdF6nc"
      },
      {
        id: "4",
        code: "ME-FM-141",
        title: "Fluid Mechanics & Turbo-Machinery",
        stream: "Thermal",
        description: "Hydrostatics, continuity formulation, Bernoulli's momentum equations, boundary layer mechanics, and operational principles of turbines and pumps.",
        link: "https://drive.google.com/open?id=1B4X4SMLfN_4f0gOZDxYs-RNxypPdOMYI"
      },
      {
        id: "5",
        code: "ME-PP-242",
        title: "Power Plant Engineering",
        stream: "Thermal",
        description: "Modern thermal cycles, Rankine regeneration and reheat analysis, boiler mountings and accessories, nozzle gas dynamics, and steam turbine design.",
        link: "https://drive.google.com/open?id=19SZ8Te_AdD9nrIaapl0w_1MIuCWyzaEK"
      },
      {
        id: "6",
        code: "ME-ICE-341",
        title: "Internal Combustion (IC) Engines",
        stream: "Thermal",
        description: "Analysis of Otto, Diesel, and Dual cycles, actual valve timing mechanisms, volumetric efficiency, detonation dynamics, and emissions standards.",
        link: "https://drive.google.com/open?id=1nfurPBOP3PP9jv9APPZEXxIziAqhj_Ec"
      },
      {
        id: "7",
        code: "ME-RAC-343",
        title: "Refrigeration & Air Conditioning",
        stream: "Thermal",
        description: "Reversed Carnot cycle, Bell-Coleman air refrigeration, single/multi-stage vapour compression cycles (VCR), COP metrics, and psychrometric chart analysis.",
        link: "https://drive.google.com/open?id=1JN7Z-jmVaxIqX7mrH_jsFbTOE0NYoTVr"
      },
      {
        id: "8",
        code: "ME-SOM-111",
        title: "Strength of Materials (SOM)",
        stream: "Design",
        description: "Stress-strain tensors, isotropic/orthotropic elastic constants (E, G, K, μ), axial elongation equations, Shear Force & Bending Moment diagrams, and thermal stresses.",
        link: "https://drive.google.com/open?id=189Jk_yEKq4bD_LXdCxT-mTFrntrQ0IbN"
      },
      {
        id: "9",
        code: "ME-TOM-211",
        title: "Theory of Machines (TOM)",
        stream: "Design",
        description: "Kinematic pair classifications, inversion geometry, velocity & acceleration analysis of mechanisms, gear tooth profiles, dynamic balancing, and governors.",
        link: "https://drive.google.com/open?id=1BDCRGBZZ615tPYn14sJ5CqKeNKOsEQqf"
      },
      {
        id: "10",
        code: "ME-EM-112",
        title: "Engineering Mechanics",
        stream: "Design",
        description: "Rigid body equilibrium, concurrent & non-concurrent coplanar force systems, Lami’s theorem, centroid & moment of inertia, and Newton's laws of dynamics.",
        link: "https://drive.google.com/open?id=1chpgFcqsbCCdgIxXAQrtnaIXb-V9K1y9"
      },
      {
        id: "11",
        code: "ME-MD-212",
        title: "Machine Design",
        stream: "Design",
        description: "Static & variable stress analysis, S-N endurance limit, Soderberg and Goodman criteria, welded/riveted joint configurations, and power transmission shafting.",
        link: "https://drive.google.com/open?id=1KKV8iSFvNp0pO-KneMsLpW0YUGQEtQxw"
      },
      {
        id: "12",
        code: "ME-PE-131",
        title: "Production Engineering & Machining",
        stream: "Manufacturing",
        description: "Orthogonal & oblique cutting mechanics, Merchant circle formulation, single-point tool signatures, gating system calculations in casting, and welding metallurgy.",
        link: "https://drive.google.com/open?id=1bvMWaqplzVdYoL3XgktcqMlHhXDbMSxz"
      },
      {
        id: "13",
        code: "ME-MS-132",
        title: "Materials Science & Metallurgy",
        stream: "Manufacturing",
        description: "Crystal lattice structures (BCC, FCC, HCP), Iron-Iron Carbide (Fe-C) equilibrium phase diagrams, TTT transformation curves, mechanical property testing, and heat treatment.",
        link: "https://drive.google.com/open?id=1pjQraeK_c5-vkddSHdMvh_rO2VKIJugH"
      }
    ];

    let files = JSON.parse(localStorage.getItem('drive_hub_files')) || INITIAL_FILES;
    let isAdmin = sessionStorage.getItem('drive_hub_auth') === 'true';
    let currentStream = 'all';

    function saveState() {
      localStorage.setItem('drive_hub_files', JSON.stringify(files));
    }

    function formatDrivePreview(url) {
      const match = url.match(/id=([a-zA-Z0-9_-]+)/) || url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      return match && match[1] ? `https://drive.google.com/file/d/${match[1]}/preview` : url;
    }

    const grid = document.getElementById("fileGrid");
    const searchInput = document.getElementById("searchInput");
    const navItems = document.querySelectorAll(".nav-item");
    const fileCountBadge = document.getElementById("fileCountBadge");
    const viewCategoryTitle = document.getElementById("viewCategoryTitle");
    const authBtn = document.getElementById("authBtn");
    const addBtn = document.getElementById("addBtn");

    const viewerModal = document.getElementById("viewerModal");
    const viewerFrame = document.getElementById("viewerFrame");
    const viewerTitle = document.getElementById("viewerTitle");
    const closeViewer = document.getElementById("closeViewer");

    const loginModal = document.getElementById("loginModal");
    const uploadModal = document.getElementById("uploadModal");

    function renderGrid() {
      authBtn.innerHTML = isAdmin 
        ? '<i class="fa-solid fa-arrow-right-from-bracket"></i> Lock'
        : '<i class="fa-solid fa-key"></i> Passkey Login';
      
      addBtn.style.display = isAdmin ? 'inline-flex' : 'none';

      const term = searchInput.value.toLowerCase().trim();
      grid.innerHTML = "";

      const filtered = files.filter(f => {
        const matchesTerm = f.title.toLowerCase().includes(term) ||
                            f.code.toLowerCase().includes(term) ||
                            f.description.toLowerCase().includes(term);

        const matchesStream = currentStream === 'all' || f.stream === currentStream;
        return matchesTerm && matchesStream;
      });

      fileCountBadge.textContent = `${filtered.length} Items`;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 60px 0; color: var(--text-muted);">
            <i class="fa-solid fa-cloud" style="font-size: 2.5rem; margin-bottom: 12px; opacity: 0.4;"></i>
            <p>No files found matching your search.</p>
          </div>
        `;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement("div");
        card.className = "file-card";
        card.innerHTML = `
          <div>
            <div class="file-preview-block">
              <i class="fa-solid fa-file-pdf"></i>
              <span class="file-code-tag">${item.code}</span>
            </div>
            <div class="file-info">
              <h4 title="${item.title}">${item.title}</h4>
              <p>${item.description}</p>
            </div>
          </div>
          <div class="file-actions-strip">
            <button class="btn-file-open" onclick="openFile('${item.title}', '${item.link}')">
              <i class="fa-solid fa-eye"></i> View
            </button>
            <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="btn-file-ext" title="Open Source Drive">
              <i class="fa-solid fa-arrow-up-right-from-square"></i>
            </a>
            ${isAdmin ? `<button class="btn-file-del" style="display:grid;" onclick="deleteFile('${item.id}')" title="Delete File"><i class="fa-solid fa-trash"></i></button>` : ''}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    searchInput.addEventListener("input", renderGrid);

    navItems.forEach(item => {
      item.addEventListener("click", () => {
        navItems.forEach(n => n.classList.remove("active"));
        item.classList.add("active");
        currentStream = item.getAttribute("data-stream");
        viewCategoryTitle.textContent = item.innerText.trim();
        renderGrid();
      });
    });

    window.openFile = function(title, link) {
      viewerTitle.textContent = title;
      viewerFrame.src = formatDrivePreview(link);
      viewerModal.classList.add("active");
    };

    closeViewer.addEventListener("click", () => {
      viewerModal.classList.remove("active");
      viewerFrame.src = "";
    });

    // Passkey Login Logic
    authBtn.addEventListener("click", () => {
      if (isAdmin) {
        isAdmin = false;
        sessionStorage.removeItem('drive_hub_auth');
        renderGrid();
      } else {
        loginModal.classList.add("active");
      }
    });

    document.getElementById("cancelLogin").addEventListener("click", () => loginModal.classList.remove("active"));
    
    document.getElementById("submitLogin").addEventListener("click", () => {
      if (document.getElementById("adminPass").value === "admin123") {
        isAdmin = true;
        sessionStorage.setItem('drive_hub_auth', 'true');
        loginModal.classList.remove("active");
        document.getElementById("adminPass").value = "";
        renderGrid();
      } else {
        alert("Incorrect secret passkey.");
      }
    });

    // Upload Logic
    addBtn.addEventListener("click", () => uploadModal.classList.add("active"));
    document.getElementById("cancelUpload").addEventListener("click", () => uploadModal.classList.remove("active"));

    document.getElementById("saveMaterial").addEventListener("click", () => {
      const code = document.getElementById("matCode").value.trim();
      const title = document.getElementById("matTitle").value.trim();
      const stream = document.getElementById("matStream").value;
      const desc = document.getElementById("matDesc").value.trim();
      const link = document.getElementById("matLink").value.trim();

      if (!code || !title || !link) {
        alert("Please complete required fields.");
        return;
      }

      files.unshift({
        id: Date.now().toString(),
        code,
        title,
        stream,
        description: desc || "Reference notes and study PDF.",
        link
      });

      saveState();
      uploadModal.classList.remove("active");
      document.getElementById("matCode").value = "";
      document.getElementById("matTitle").value = "";
      document.getElementById("matDesc").value = "";
      document.getElementById("matLink").value = "";
      renderGrid();
    });

    window.deleteFile = function(id) {
      if (confirm("Delete this file permanently?")) {
        files = files.filter(x => x.id !== id);
        saveState();
        renderGrid();
      }
    };

    [viewerModal, loginModal, uploadModal].forEach(modal => {
      modal.addEventListener("click", e => {
        if (e.target === modal) {
          modal.classList.remove("active");
          if (modal === viewerModal) viewerFrame.src = "";
        }
      });
    });

    renderGrid();
  </script>
</body>
</html>
