<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mission Sarkari Engineer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --header-bg: #0f172a;
      --subbar-bg: #1e293b;
      --accent: #2563eb;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --danger: #dc2626;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Broad Header */
    .top-broad-header {
      background: var(--header-bg);
      color: #ffffff;
      padding: 24px 20px;
      text-align: center;
    }

    .top-broad-header h1 {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* Sub-Bar */
    .sub-bar {
      background: var(--subbar-bg);
      border-bottom: 2px solid var(--accent);
      padding: 8px 24px;
    }

    .sub-bar-inner {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
    }

    .btn-sub {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .btn-sub:hover {
      background: #ffffff;
      color: var(--header-bg);
    }

    .btn-upload {
      background: var(--accent);
      border-color: var(--accent);
    }

    .btn-upload:hover {
      background: #1d4ed8;
      color: #ffffff;
    }

    /* Center Main */
    main {
      flex: 1;
      max-width: 1000px;
      margin: 0 auto;
      padding: 36px 20px 60px;
      width: 100%;
    }

    .search-box {
      position: relative;
      margin-bottom: 24px;
    }

    .search-box input {
      width: 100%;
      padding: 13px 18px 13px 44px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.92rem;
      outline: none;
      background: var(--surface);
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .search-box i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    /* Registry Table */
    .table-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    thead {
      background: #f1f5f9;
      border-bottom: 1px solid var(--border);
    }

    th {
      padding: 12px 18px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background: #fafbfc;
    }

    td {
      padding: 14px 18px;
      vertical-align: middle;
    }

    .subject-cell {
      font-weight: 600;
      color: var(--text);
    }

    .stream-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      background: #f1f5f9;
      color: var(--text-muted);
      border: 1px solid var(--border);
      text-transform: uppercase;
    }

    .action-group {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
    }

    .btn-action {
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
    }

    .btn-action:hover {
      background: var(--header-bg);
      color: #ffffff;
      border-color: var(--header-bg);
    }

    .btn-del {
      color: var(--danger);
      border-color: #fecaca;
      background: #fef2f2;
      display: none;
    }

    .btn-del:hover {
      background: var(--danger);
      color: #ffffff;
    }

    /* Footer */
    footer {
      background: var(--header-bg);
      color: #94a3b8;
      border-top: 1px solid #334155;
      padding: 16px 24px;
      font-size: 0.8rem;
    }

    .footer-inner {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .visitor-box {
      font-family: 'JetBrains Mono', monospace;
      color: #cbd5e1;
      font-size: 0.78rem;
    }

    .visitor-count {
      color: #38bdf8;
      font-weight: 700;
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      display: none;
      place-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.active {
      display: grid;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 6px;
      width: 100%;
      max-width: 420px;
      padding: 24px;
    }

    .modal-card.viewer {
      max-width: 1050px;
      height: 90vh;
      display: flex;
      flex-direction: column;
      padding: 0;
    }

    .modal-header {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .form-control {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.88rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <!-- Top Broad Strip -->
  <div class="top-broad-header">
    <h1>Mission Sarkari Engineer</h1>
  </div>

  <!-- Sub-Bar -->
  <div class="sub-bar">
    <div class="sub-bar-inner">
      <button id="addBtn" class="btn-sub btn-upload" style="display: none;">
        <i class="fa-solid fa-plus"></i> Upload Document
      </button>
      <button id="authBtn" class="btn-sub">
        <i class="fa-solid fa-lock"></i> Admin Login
      </button>
    </div>
  </div>

  <!-- Main Center -->
  <main>
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="Search by subject name or stream (e.g. SOM, Thermodynamics, PYQ)..." />
    </div>

    <!-- Table Registry -->
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Subject / Document</th>
            <th style="width: 220px;">Stream</th>
            <th style="width: 180px; text-align: right;">Action</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-inner">
      <div class="visitor-box">
        <span>PORTAL VISITS:</span>
        <span id="visitorCountDisplay" class="visitor-count">000000</span>
      </div>
      <div>&copy; Mission Sarkari Engineer</div>
    </div>
  </footer>

  <!-- Reader Modal -->
  <div id="viewerModal" class="modal-overlay">
    <div class="modal-card viewer">
      <div class="modal-header">
        <span id="viewerTitle">Document</span>
        <button id="closeViewer" style="background:none; border:none; font-size:1.2rem; cursor:pointer;">&times;</button>
      </div>
      <iframe id="viewerFrame" style="flex:1; width:100%; border:none; background:#f1f5f9;" src="" allow="autoplay"></iframe>
    </div>
  </div>

  <!-- Admin Login Modal -->
  <div id="loginModal" class="modal-overlay">
    <div class="modal-card">
      <h3 style="font-size: 1.1rem; margin-bottom: 4px;">Admin Access</h3>
      <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 16px;">Enter security passkey.</p>

      <div class="form-group">
        <label>Passkey</label>
        <input type="password" id="authPass" class="form-control" placeholder="Enter password..." />
      </div>

      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px;">
        <button id="cancelLogin" class="btn-action">Cancel</button>
        <button id="submitLogin" class="btn-action" style="background:var(--header-bg); color:#fff;">Unlock</button>
      </div>
    </div>
  </div>

  <!-- Upload Modal -->
  <div id="addModal" class="modal-overlay">
    <div class="modal-card">
      <h3 style="font-size: 1.1rem; margin-bottom: 4px;">Upload Document</h3>
      <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 16px;">Save a new document link.</p>

      <div class="form-group">
        <label>Stream</label>
        <select id="docFolder" class="form-control">
          <option value="Thermal & Fluids">Thermal & Fluids</option>
          <option value="Design & Mechanics">Design & Mechanics</option>
          <option value="Production & Materials">Production & Materials</option>
          <option value="Revision & PYQs">Revision & PYQs</option>
        </select>
      </div>

      <div class="form-group">
        <label>Subject Title</label>
        <input type="text" id="docTitle" class="form-control" placeholder="e.g. Thermodynamics" required />
      </div>

      <div class="form-group">
        <label>Google Drive Share Link</label>
        <input type="url" id="docLink" class="form-control" placeholder="https://drive.google.com/file/d/..." required />
      </div>

      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px;">
        <button id="cancelUpload" class="btn-action">Cancel</button>
        <button id="saveDoc" class="btn-action" style="background:var(--header-bg); color:#fff;">Save</button>
      </div>
    </div>
  </div>

  <script>
    const INITIAL_DOCS = [
      { id: "1", stream: "Revision & PYQs", title: "Mechanical Theory Revision Capsule", link: "https://drive.google.com/open?id=1nyXHDl0-xdNMWxLeAzCayeLnB-nwTDH-" },
      { id: "2", stream: "Revision & PYQs", title: "Mechanical AE/JE & SSC JE Solved Question Bank", link: "https://drive.google.com/open?id=1xPqE7Dsv1FeGlr8Sf0BU7jbisB74YrGQ" },
      { id: "3", stream: "Thermal & Fluids", title: "Thermodynamics & Heat Engines", link: "https://drive.google.com/open?id=18czooBJGIBgsI6T4iLX98hFbL2cdF6nc" },
      { id: "4", stream: "Thermal & Fluids", title: "Fluid Mechanics & Hydraulic Machinery", link: "https://drive.google.com/open?id=1B4X4SMLfN_4f0gOZDxYs-RNxypPdOMYI" },
      { id: "5", stream: "Thermal & Fluids", title: "Power Plant Engineering", link: "https://drive.google.com/open?id=19SZ8Te_AdD9nrIaapl0w_1MIuCWyzaEK" },
      { id: "6", stream: "Thermal & Fluids", title: "Internal Combustion (IC) Engines", link: "https://drive.google.com/open?id=1nfurPBOP3PP9jv9APPZEXxIziAqhj_Ec" },
      { id: "7", stream: "Thermal & Fluids", title: "Refrigeration & Air Conditioning (RAC)", link: "https://drive.google.com/open?id=1JN7Z-jmVaxIqX7mrH_jsFbTOE0NYoTVr" },
      { id: "8", stream: "Design & Mechanics", title: "Strength of Materials (SOM)", link: "https://drive.google.com/open?id=189Jk_yEKq4bD_LXdCxT-mTFrntrQ0IbN" },
      { id: "9", stream: "Design & Mechanics", title: "Theory of Machines (TOM)", link: "https://drive.google.com/open?id=1BDCRGBZZ615tPYn14sJ5CqKeNKOsEQqf" },
      { id: "10", stream: "Design & Mechanics", title: "Engineering Mechanics", link: "https://drive.google.com/open?id=1chpgFcqsbCCdgIxXAQrtnaIXb-V9K1y9" },
      { id: "11", stream: "Design & Mechanics", title: "Machine Design", link: "https://drive.google.com/open?id=1KKV8iSFvNp0pO-KneMsLpW0YUGQEtQxw" },
      { id: "12", stream: "Production & Materials", title: "Production Engineering & Machining", link: "https://drive.google.com/open?id=1bvMWaqplzVdYoL3XgktcqMlHhXDbMSxz" },
      { id: "13", stream: "Production & Materials", title: "Materials Science & Metallurgy", link: "https://drive.google.com/open?id=1pjQraeK_c5-vkddSHdMvh_rO2VKIJugH" }
    ];

    let docs = JSON.parse(localStorage.getItem('mse_final_docs')) || INITIAL_DOCS;
    let isAdmin = sessionStorage.getItem('mse_final_auth') === 'true';

    function saveState() {
      localStorage.setItem('mse_final_docs', JSON.stringify(docs));
    }

    function formatDrivePreview(url) {
      const match = url.match(/id=([a-zA-Z0-9_-]+)/) || url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      return match && match[1] ? `https://drive.google.com/file/d/${match[1]}/preview` : url;
    }

    function handleVisits() {
      let v = parseInt(localStorage.getItem('mse_final_visits') || '3120', 10) + 1;
      localStorage.setItem('mse_final_visits', v.toString());
      document.getElementById('visitorCountDisplay').textContent = v.toString().padStart(6, '0');
    }

    const tableBody = document.getElementById('tableBody');
    const searchInput = document.getElementById('searchInput');
    const authBtn = document.getElementById('authBtn');
    const addBtn = document.getElementById('addBtn');

    const viewerModal = document.getElementById('viewerModal');
    const viewerFrame = document.getElementById('viewerFrame');
    const viewerTitle = document.getElementById('viewerTitle');
    const closeViewer = document.getElementById('closeViewer');

    const loginModal = document.getElementById('loginModal');
    const addModal = document.getElementById('addModal');

    function renderTable() {
      authBtn.innerHTML = isAdmin ? '<i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out' : '<i class="fa-solid fa-lock"></i> Admin Login';
      addBtn.style.display = isAdmin ? 'inline-flex' : 'none';

      const query = searchInput.value.toLowerCase().trim();
      const filtered = docs.filter(d => 
        d.title.toLowerCase().includes(query) || 
        d.stream.toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="3" style="text-align: center; padding: 28px; color: var(--text-muted);">
              No matching subjects found.
            </td>
          </tr>
        `;
        return;
      }

      let html = '';
      filtered.forEach(doc => {
        html += `
          <tr>
            <td class="subject-cell">${doc.title}</td>
            <td><span class="stream-tag">${doc.stream}</span></td>
            <td>
              <div class="action-group">
                <button class="btn-action" onclick="openDoc('${doc.title}', '${doc.link}')">
                  <i class="fa-solid fa-eye"></i> Read
                </button>
                <a href="${doc.link}" target="_blank" rel="noopener noreferrer" class="btn-action" title="Open Drive">
                  <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
                ${isAdmin ? `<button class="btn-action btn-del" style="display:inline-flex;" onclick="deleteDoc('${doc.id}')"><i class="fa-solid fa-trash"></i></button>` : ''}
              </div>
            </td>
          </tr>
        `;
      });
      tableBody.innerHTML = html;
    }

    searchInput.addEventListener('input', renderTable);

    window.openDoc = function(title, link) {
      viewerTitle.textContent = title;
      viewerFrame.src = formatDrivePreview(link);
      viewerModal.classList.add('active');
    };

    closeViewer.addEventListener('click', () => {
      viewerModal.classList.remove('active');
      viewerFrame.src = "";
    });

    // Passkey Login: Shiv@1212
    authBtn.addEventListener('click', () => {
      if (isAdmin) {
        isAdmin = false;
        sessionStorage.removeItem('mse_final_auth');
        renderTable();
      } else {
        loginModal.classList.add('active');
      }
    });

    document.getElementById('cancelLogin').addEventListener('click', () => loginModal.classList.remove('active'));

    document.getElementById('submitLogin').addEventListener('click', () => {
      if (document.getElementById('authPass').value === "Shiv@1212") {
        isAdmin = true;
        sessionStorage.setItem('mse_final_auth', 'true');
        loginModal.classList.remove('active');
        document.getElementById('authPass').value = "";
        renderTable();
      } else {
        alert("Incorrect passkey.");
      }
    });

    addBtn.addEventListener('click', () => addModal.classList.add('active'));
    document.getElementById('cancelUpload').addEventListener('click', () => addModal.classList.remove('active'));

    document.getElementById('saveDoc').addEventListener('click', () => {
      const stream = document.getElementById('docFolder').value;
      const title = document.getElementById('docTitle').value.trim();
      const link = document.getElementById('docLink').value.trim();

      if (!title || !link) {
        alert("Please fill all fields.");
        return;
      }

      docs.unshift({ id: Date.now().toString(), stream, title, link });
      saveState();
      addModal.classList.remove('active');
      document.getElementById('docTitle').value = "";
      document.getElementById('docLink').value = "";
      renderTable();
    });

    window.deleteDoc = function(id) {
      if (confirm("Delete this document?")) {
        docs = docs.filter(d => d.id !== id);
        saveState();
        renderTable();
      }
    };

    [viewerModal, loginModal, addModal].forEach(m => {
      m.addEventListener('click', e => {
        if (e.target === m) {
          m.classList.remove('active');
          if (m === viewerModal) viewerFrame.src = "";
        }
      });
    });

    handleVisits();
    renderTable();
  </script>
</body>
</html>
