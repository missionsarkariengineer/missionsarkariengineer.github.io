<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MechPortal | Mechanical Engineering & SSC JE Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-surface: #111827;
      --bg-surface-elevated: #1f2937;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(59, 130, 246, 0.4);
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1150px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Navbar */
    nav {
      border-bottom: 1px solid var(--border-color);
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .nav-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 64px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.15rem;
      color: #fff;
      text-decoration: none;
    }

    .brand-badge {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 9999px;
      font-weight: 600;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 60px 0 35px;
    }

    .hero h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      background: linear-gradient(180deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 580px;
      margin: 0 auto;
    }

    /* Controls */
    .controls {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 35px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .search-wrapper {
      position: relative;
    }

    .search-input {
      width: 100%;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .pill-btn {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pill-btn:hover {
      color: var(--text-main);
      border-color: var(--border-hover);
    }

    .pill-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    /* Counter Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 20px;
      padding-bottom: 70px;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--border-hover);
      box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.5);
    }

    .badge-group {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tag {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .tag-thermal { background: rgba(239, 68, 68, 0.12); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }
    .tag-design { background: rgba(59, 130, 246, 0.12); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.2); }
    .tag-mfg { background: rgba(16, 185, 129, 0.12); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); }
    .tag-general { background: rgba(168, 85, 247, 0.12); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.2); }

    .card h3 {
      font-size: 1.15rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .card p {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .btn-access {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--bg-surface-elevated);
      color: #ffffff;
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-access:hover {
      background: var(--accent);
      border-color: var(--accent);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 0;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <div class="container nav-content">
      <a href="#" class="brand">
        ⚙️ MechHub
        <span class="brand-badge">v2.0 Portal</span>
      </a>
      <span style="font-size: 0.85rem; color: var(--text-muted);">Open Access</span>
    </div>
  </nav>

  <!-- Hero -->
  <div class="container hero">
    <h1>Mechanical Resource Center</h1>
    <p>Curated notes, PYQ repositories, and revision capsules for SSC JE & AE exams.</p>
  </div>

  <!-- Main Portal -->
  <main class="container">
    <div class="controls">
      <div class="search-wrapper">
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="Search materials (e.g. SOM, Power Plant, Machine Design)..." 
        />
      </div>

      <div class="filter-pills" id="categoryPills">
        <button class="pill-btn active" data-filter="all">All Modules</button>
        <button class="pill-btn" data-filter="Thermal">Thermal & Fluids</button>
        <button class="pill-btn" data-filter="Design">Applied Mechanics & SOM</button>
        <button class="pill-btn" data-filter="Manufacturing">Production & Materials</button>
        <button class="pill-btn" data-filter="Capsule">Capsules & PYQs</button>
      </div>
    </div>

    <div class="status-bar">
      <span id="resourceCount">Showing resources</span>
      <span style="color: #60a5fa;">● Verified Drive Links</span>
    </div>

    <div id="materialGrid" class="grid"></div>
  </main>

  <script>
    const studyMaterials = [
      {
        title: "M.E. Theory & Revision Capsule",
        category: "Capsule",
        subjectType: "General",
        tagClass: "tag-general",
        description: "Complete quick revision capsule and formula handbook covering all core mechanical engineering concepts.",
        link: "https://drive.google.com/open?id=1nyXHDl0-xdNMWxLeAzCayeLnB-nwTDH-"
      },
      {
        title: "M.E. Previous Year Questions (PYQs)",
        category: "Capsule",
        subjectType: "General",
        tagClass: "tag-general",
        description: "Comprehensive question bank containing solved previous year papers for SSC JE and state AE/JE.",
        link: "https://drive.google.com/open?id=1xPqE7Dsv1FeGlr8Sf0BU7jbisB74YrGQ"
      },
      {
        title: "Thermodynamics",
        category: "Thermal",
        subjectType: "Thermal",
        tagClass: "tag-thermal",
        description: "System properties, Laws of Thermodynamics, cycles, and pure substances.",
        link: "https://drive.google.com/open?id=18czooBJGIBgsI6T4iLX98hFbL2cdF6nc"
      },
      {
        title: "Fluid Mechanics & Hydraulics",
        category: "Thermal",
        subjectType: "Thermal",
        tagClass: "tag-thermal",
        description: "Fluid properties, kinematics, boundary layer concepts, pumps, and hydraulic turbines.",
        link: "https://drive.google.com/open?id=1B4X4SMLfN_4f0gOZDxYs-RNxypPdOMYI"
      },
      {
        title: "Power Plant Engineering",
        category: "Thermal",
        subjectType: "Thermal",
        tagClass: "tag-thermal",
        description: "Steam power cycles, Rankine efficiency, boiler classifications, and turbine operations.",
        link: "https://drive.google.com/open?id=19SZ8Te_AdD9nrIaapl0w_1MIuCWyzaEK"
      },
      {
        title: "Internal Combustion (IC) Engine",
        category: "Thermal",
        subjectType: "Thermal",
        tagClass: "tag-thermal",
        description: "Otto/Diesel cycles, actual valve timing diagrams, and combustion performance.",
        link: "https://drive.google.com/open?id=1nfurPBOP3PP9jv9APPZEXxIziAqhj_Ec"
      },
      {
        title: "Refrigeration & Air Conditioning (RAC)",
        category: "Thermal",
        subjectType: "Thermal",
        tagClass: "tag-thermal",
        description: "Vapour compression/absorption cycles, COP equations, and psychrometric charts.",
        link: "https://drive.google.com/open?id=1JN7Z-jmVaxIqX7mrH_jsFbTOE0NYoTVr"
      },
      {
        title: "Strength of Materials (SOM)",
        category: "Design",
        subjectType: "Design",
        tagClass: "tag-design",
        description: "Stress-strain analysis, elastic constants, SFD/BMD, and deflection theories.",
        link: "https://drive.google.com/open?id=189Jk_yEKq4bD_LXdCxT-mTFrntrQ0IbN"
      },
      {
        title: "Theory of Machines (TOM)",
        category: "Design",
        subjectType: "Design",
        tagClass: "tag-design",
        description: "Kinematic link analysis, gear trains, dynamic balancing, and flywheel mechanics.",
        link: "https://drive.google.com/open?id=1BDCRGBZZ615tPYn14sJ5CqKeNKOsEQqf"
      },
      {
        title: "Engineering Mechanics",
        category: "Design",
        subjectType: "Design",
        tagClass: "tag-design",
        description: "Coplanar concurrent force systems, friction parameters, centroid, and dynamics.",
        link: "https://drive.google.com/open?id=1chpgFcqsbCCdgIxXAQrtnaIXb-V9K1y9"
      },
      {
        title: "Machine Design",
        category: "Design",
        subjectType: "Design",
        tagClass: "tag-design",
        description: "Static and fluctuating stresses, welded/riveted joints, and shafts design.",
        link: "https://drive.google.com/open?id=1KKV8iSFvNp0pO-KneMsLpW0YUGQEtQxw"
      },
      {
        title: "Production Engineering",
        category: "Manufacturing",
        subjectType: "Manufacturing",
        tagClass: "tag-mfg",
        description: "Single/multi-point cutting tools, orthogonal mechanics, casting, and welding.",
        link: "https://drive.google.com/open?id=1bvMWaqplzVdYoL3XgktcqMlHhXDbMSxz"
      },
      {
        title: "Material Science",
        category: "Manufacturing",
        subjectType: "Manufacturing",
        tagClass: "tag-mfg",
        description: "Crystal lattice structures, iron-carbon phase diagrams, and heat treatment.",
        link: "https://drive.google.com/open?id=1pjQraeK_c5-vkddSHdMvh_rO2VKIJugH"
      }
    ];

    let currentFilter = 'all';
    const grid = document.getElementById("materialGrid");
    const searchInput = document.getElementById("searchInput");
    const pillButtons = document.querySelectorAll(".pill-btn");
    const countDisplay = document.getElementById("resourceCount");

    function render(data) {
      grid.innerHTML = "";
      countDisplay.textContent = `Showing ${data.length} module${data.length === 1 ? '' : 's'}`;

      if (data.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <h3>No study modules match your search</h3>
            <p>Try searching for another subject or clear the filters.</p>
          </div>
        `;
        return;
      }

      data.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div>
            <div class="badge-group">
              <span class="tag ${item.tagClass}">${item.category}</span>
            </div>
            <h3>${item.title}</h3>
            <p>${item.description}</p>
          </div>
          <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="btn-access">
            Open Document →
          </a>
        `;
        grid.appendChild(card);
      });
    }

    function applyFilter() {
      const term = searchInput.value.toLowerCase().trim();

      const filtered = studyMaterials.filter(item => {
        const matchesTerm = item.title.toLowerCase().includes(term) ||
                            item.description.toLowerCase().includes(term);

        const matchesFilter = currentFilter === 'all' || 
                              item.category === currentFilter ||
                              (currentFilter === 'Capsule' && item.category === 'Capsule');

        return matchesTerm && matchesFilter;
      });

      render(filtered);
    }

    pillButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        pillButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.getAttribute("data-filter");
        applyFilter();
      });
    });

    searchInput.addEventListener("input", applyFilter);

    // Initial Load
    render(studyMaterials);
  </script>
</body>
</html>
